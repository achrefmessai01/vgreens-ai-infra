---
- name: APT prerequisites
  ansible.builtin.apt:
    name: [debian-keyring, debian-archive-keyring, apt-transport-https, curl, ca-certificates]
    state: present
    update_cache: true
  become: true

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Caddy APT signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
  become: true

- name: Caddy APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    filename: caddy-stable
    state: present
  become: true

- name: Install caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
  become: true

- name: Ensure web root exists
  ansible.builtin.file:
    path: "{{ caddy_web_root }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"
  become: true
  when: caddy_web_root | length > 0

- name: Deploy the built web app
  ansible.builtin.copy:
    src: "{{ caddy_web_src }}/"
    dest: "{{ caddy_web_root }}/"
    owner: caddy
    group: caddy
    mode: "0644"
    directory_mode: "0755"
  become: true
  when: caddy_web_root | length > 0 and caddy_web_src | length > 0
  notify: reload caddy

- name: Caddyfile (reverse proxy for the Job API + optional web UI)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
  become: true
  notify: reload caddy

- name: Enable + start caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
  become: true
