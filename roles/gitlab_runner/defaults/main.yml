---
gitlab_runner_url: "https://gitlab.com"
gitlab_runner_name: "vgreens-sv01-cpu"
# authentication token (glrt-...) from GitLab → set in vault as vault_gitlab_runner_token
gitlab_runner_token: "{{ vault_gitlab_runner_token }}"
gitlab_runner_concurrent: 1
# per-job container resource caps (Docker executor) — protect sv01's prod workloads
gitlab_runner_job_cpus: "4"
gitlab_runner_job_memory: "8g"
gitlab_runner_default_image: "docker:27"
