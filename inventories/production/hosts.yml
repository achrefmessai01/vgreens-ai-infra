# Reached from the Mac over the VPN. gpu-worker-01 sits on the LAN behind sv01,
# so we ProxyJump through sv01 (the VPN jump host at 10.8.0.30).
all:
  children:
    platform:                 # the GPU/AI host
      hosts:
        gpu-worker-01:
          ansible_host: 172.16.20.89
          ansible_user: vgreens
          ansible_ssh_common_args: '-o ProxyJump=vgreens@10.8.0.30'
    runners:                  # candidate CI runner host (audited before use)
      hosts:
        sv01:
          ansible_host: 10.8.0.30
          ansible_user: vgreens
