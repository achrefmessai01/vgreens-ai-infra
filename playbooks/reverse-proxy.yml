---
# Milestone 7 — HTTPS reverse proxy (Caddy, internal CA) in front of the Job API
# on gpu-worker-01. The API keeps binding 127.0.0.1:8000; only Caddy is exposed
# on 443, so clients reach it over the VPN at https://{{ caddy_api_host }}.
- name: Deploy Caddy reverse proxy for the Job API on the VPN-reachable host (sv01)
  hosts: runners
  become: true
  vars:
    # sv01 reaches the API on gpu-worker over the LAN/VPN; clients reach sv01's
    # VPN IP. Bind to that IP so the proxy is not exposed on sv01's public NIC.
    # 443 is taken by nginx (livestream), so use 8443.
    caddy_api_upstream: "172.16.20.89:8000"
    caddy_bind: "{{ ansible_host }}"
    caddy_https_port: 8443
  roles:
    - caddy
